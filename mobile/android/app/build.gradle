plugins {
    id 'com.android.application'
}

// D86: push needs the Owner's Firebase config app/google-services.json (never in the repo: scripts/mobile/build-android.mjs copies
// it from HX_GOOGLE_SERVICES_JSON and refuses a release without it). Without the file the app builds and runs with no push.
def googleServices = file('google-services.json').exists()
if (googleServices) {
    apply plugin: 'com.google.gms.google-services'
}

// Signing key kept by the Owner (never in the repo): HX_APK_KEYSTORE = path of hien-xa.keystore,
// HX_APK_KEYSTORE_PASS_FILE = file holding its password (the key uses the same password).
def keystorePath = System.getenv('HX_APK_KEYSTORE')
def keystorePassFile = System.getenv('HX_APK_KEYSTORE_PASS_FILE')

android {
    namespace 'com.hienxavlxd.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hienxavlxd.app'
        minSdk 24
        targetSdk 36
        // Version 1 was the Trusted Web Activity; same package and key, so this installs over it.
        versionCode 6
        versionName '2.3.1'
        buildConfigField 'String', 'APP_URL', '"https://app.hienxavlxd.com/"'
        buildConfigField 'String', 'APP_HOST', '"app.hienxavlxd.com"'
        buildConfigField 'boolean', 'PUSH_CONFIGURED', googleServices ? 'true' : 'false'
    }

    signingConfigs {
        release {
            if (keystorePath && keystorePassFile) {
                def password = new File(keystorePassFile).text.trim()
                storeFile file(keystorePath)
                storePassword password
                keyAlias 'hienxa'
                keyPassword password
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : null
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
