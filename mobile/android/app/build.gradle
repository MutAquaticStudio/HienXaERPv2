plugins {
    id 'com.android.application'
}

// Signing key kept by the Owner (never in the repo): HX_APK_KEYSTORE = path of hien-xa.keystore,
// HX_APK_KEYSTORE_PASS_FILE = file holding its password (the key uses the same password).
def keystorePath = System.getenv('HX_APK_KEYSTORE')
def keystorePassFile = System.getenv('HX_APK_KEYSTORE_PASS_FILE')

android {
    namespace 'com.hienxavlxd.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hienxavlxd.app'
        minSdk 24
        targetSdk 36
        // Version 1 was the Trusted Web Activity; same package and key, so this installs over it.
        versionCode 3
        versionName '2.1.0'
        buildConfigField 'String', 'APP_URL', '"https://app.hienxavlxd.com/"'
        buildConfigField 'String', 'APP_HOST', '"app.hienxavlxd.com"'
    }

    signingConfigs {
        release {
            if (keystorePath && keystorePassFile) {
                def password = new File(keystorePassFile).text.trim()
                storeFile file(keystorePath)
                storePassword password
                keyAlias 'hienxa'
                keyPassword password
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : null
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
